# The built web app in front of the one-command demo, as one origin: the app itself, and the
# backend's API, live connection and test payment gateway behind it (run.sh).
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://rideflow-lb:8080;
    proxy_set_header Host $host;
  }

  location /mock-gateway/ {
    proxy_pass http://rideflow-lb:8080;
    proxy_set_header Host $host;
  }

  location /ws {
    proxy_pass http://rideflow-lb:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # The backend takes WebSockets from its own origin only, as the Vite dev server arranges too.
    proxy_set_header Origin http://localhost:8080;
    proxy_read_timeout 120s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
