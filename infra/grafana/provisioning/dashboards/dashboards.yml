apiVersion: 1

providers:
  - name: RideFlow
    orgId: 1
    folder: RideFlow
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: false
    options:
      # Dashboards live in git (dashboards as code) and are mounted read-only.
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
