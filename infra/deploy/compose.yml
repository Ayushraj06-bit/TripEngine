# RideFlow on one VM (docs/deploy.md): Caddy in front of two backends; PostgreSQL, Redis, Kafka,
# Prometheus and Grafana on the Compose network only. Run from the repository, once the secrets
# exist (generate-secrets.sh) and infra/deploy/.env is filled in (.env.example):
#
#   docker compose -f infra/deploy/compose.yml up -d
#
# Rehearsed every night on a CI VM (.github/workflows/nightly.yml), with these files as they are.
name: rideflow

x-logging: &logging
  # Bounded on disk, unlike Docker's default json-file.
  driver: local

x-backend: &backend
  image: ${RIDEFLOW_IMAGE:-ghcr.io/ayushraj06-bit/rideflow-backend:phase-11}
  restart: unless-stopped
  environment:
    SPRING_PROFILES_ACTIVE: prod
    # One file per secret, named for the variable application.yml reads.
    SPRING_CONFIG_IMPORT: configtree:/run/rideflow/
    RIDEFLOW_DB_URL: jdbc:postgresql://postgres:5432/rideflow
    RIDEFLOW_DB_USER: rideflow
    RIDEFLOW_REDIS_HOST: redis
    RIDEFLOW_REDIS_PORT: "6379"
    RIDEFLOW_KAFKA_BOOTSTRAP: kafka:19092
    RIDEFLOW_JWT_ISSUER: https://${RIDEFLOW_DOMAIN:?set RIDEFLOW_DOMAIN in infra/deploy/.env}
    RIDEFLOW_ADMIN_PHONE: ${RIDEFLOW_ADMIN_PHONE:?set RIDEFLOW_ADMIN_PHONE in infra/deploy/.env}
    # Actuator, for Prometheus on this network; never published.
    RIDEFLOW_MANAGEMENT_PORT: "8090"
  volumes:
    - ${RIDEFLOW_SECRETS:-/etc/rideflow/secrets}:/run/rideflow:ro
  # Longer than the application's own shutdown: 20 s for requests in flight, then 15 s for event
  # listeners. Docker's default is 10 s.
  stop_grace_period: 40s
  logging: *logging
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    kafka: { condition: service_healthy }

services:
  # The only service with published ports. It obtains and renews the certificate itself.
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    environment:
      RIDEFLOW_DOMAIN: ${RIDEFLOW_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    logging: *logging
    depends_on:
      backend-1: { condition: service_healthy }
      backend-2: { condition: service_healthy }

  backend-1: *backend
  backend-2: *backend

  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rideflow
      POSTGRES_USER: rideflow
      POSTGRES_PASSWORD_FILE: /run/rideflow/RIDEFLOW_DB_PASSWORD
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ${RIDEFLOW_SECRETS:-/etc/rideflow/secrets}:/run/rideflow:ro
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rideflow -d rideflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  # No persistence on purpose: positions, offers and quotes are minutes old by nature, and rebuild
  # themselves from the drivers' next reports and PostgreSQL.
  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.2.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    logging: *logging
    healthcheck:
      test:
        ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  # Scrapes backend-1 and backend-2 on 8090 (infra/prometheus/prometheus.yml) and loads the alerts.
  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10

  # On the VM's loopback only: reached over an SSH tunnel (ssh -L 3000:localhost:3000 the-vm).
  grafana:
    image: grafana/grafana:13.2.2
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    # In the secrets' group, so it can read its own password file.
    user: "472:10001"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/rideflow/GRAFANA_ADMIN_PASSWORD
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
      - ${RIDEFLOW_SECRETS:-/etc/rideflow/secrets}:/run/rideflow:ro
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 15
    depends_on:
      - prometheus

volumes:
  caddy-data:
  postgres-data:
  kafka-data:
  prometheus-data:
  grafana-data:
