upstream rideflow_backend {
    # Plain round robin on purpose. PROJECT_SPEC section 5 delivers real-time
    # messages through Redis Pub/Sub, so a client may land on either instance
    # and no sticky session is needed.
    server backend-1:8080 max_fails=3 fail_timeout=10s;
    server backend-2:8080 max_fails=3 fail_timeout=10s;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /ws {
        proxy_pass http://rideflow_backend;
        # STOMP over WebSocket: the connection must be upgraded and kept open.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Any proxy_set_header here drops every one from the server block, so they
        # are repeated. Without Host, nginx sends the upstream's name, and Tomcat
        # answers 400: an underscore is never valid in a host.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
    }

    location / {
        proxy_pass http://rideflow_backend;
        proxy_connect_timeout 2s;
        proxy_read_timeout    30s;
    }
}
