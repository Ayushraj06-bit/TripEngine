# Two backend instances behind nginx, to prove the cross-instance real-time
# path (PROJECT_SPEC section 5: Redis Pub/Sub fan-out) and to load-test with
# more than one node.
#
#   export RIDEFLOW_RSA_PRIVATE_KEY=... RIDEFLOW_RSA_PUBLIC_KEY=...   (docs/runbook.md)
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.scale.yml up -d --build
#
# The load balancer listens on 8080; the instances are on 8091 and 8092 so they
# can be inspected one by one.
name: rideflow

services:
  backend-1: &backend
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    environment: &backend-env
      RIDEFLOW_DB_URL: jdbc:postgresql://postgres:5432/rideflow
      RIDEFLOW_DB_USER: rideflow
      RIDEFLOW_DB_PASSWORD: rideflow
      RIDEFLOW_REDIS_HOST: redis
      RIDEFLOW_REDIS_PORT: "6379"
      RIDEFLOW_KAFKA_BOOTSTRAP: kafka:19092
      RIDEFLOW_LOG_FORMAT: ecs
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      # One key pair for both, or a token signed by one is rejected by the other.
      # Never committed: generate it as docs/runbook.md "Two-instance setup" shows.
      RIDEFLOW_RSA_PRIVATE_KEY: ${RIDEFLOW_RSA_PRIVATE_KEY:?generate a shared key pair first, see docs/runbook.md}
      RIDEFLOW_RSA_PUBLIC_KEY: ${RIDEFLOW_RSA_PUBLIC_KEY:?generate a shared key pair first, see docs/runbook.md}
    ports:
      - "8091:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  backend-2:
    <<: *backend
    environment:
      <<: *backend-env
    ports:
      - "8092:8080"

  loadbalancer:
    image: nginx:1.31-alpine
    container_name: rideflow-lb
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/rideflow.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-1
      - backend-2
