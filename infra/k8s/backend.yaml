# The backend on Kubernetes (docs/deploy.md). PostgreSQL, Redis and Kafka are assumed managed,
# outside the cluster. Schema-checked in CI with kubeconform; not yet run on a real cluster.
#
# Secrets are never committed. Create them from the files docs/deploy.md generates:
#   kubectl create secret generic rideflow-secrets --from-file=/etc/rideflow/secrets/
#   kubectl create secret docker-registry ghcr --docker-server=ghcr.io \
#     --docker-username=<user> --docker-password=<token with read:packages>
apiVersion: v1
kind: ConfigMap
metadata:
  name: rideflow-backend
  labels:
    app.kubernetes.io/name: rideflow-backend
data:
  SPRING_PROFILES_ACTIVE: prod
  SPRING_CONFIG_IMPORT: configtree:/run/rideflow/
  RIDEFLOW_DB_URL: jdbc:postgresql://postgres.example.internal:5432/rideflow
  RIDEFLOW_DB_USER: rideflow
  RIDEFLOW_REDIS_HOST: redis.example.internal
  RIDEFLOW_REDIS_PORT: "6379"
  RIDEFLOW_KAFKA_BOOTSTRAP: kafka.example.internal:9092
  RIDEFLOW_JWT_ISSUER: https://rideflow.example.com
  RIDEFLOW_ADMIN_PHONE: "+91XXXXXXXXXX"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rideflow-backend
  labels:
    app.kubernetes.io/name: rideflow-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rideflow-backend
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rideflow-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: /actuator/prometheus
    spec:
      # Longer than the application's 20 s to finish in-flight requests on shutdown.
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # The mounted secret files belong to this group, so the application can read them.
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/ayushraj06-bit/rideflow-backend:phase-11
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8090
          envFrom:
            - configMapRef:
                name: rideflow-backend
          volumeMounts:
            - name: secrets
              mountPath: /run/rideflow
              readOnly: true
            - name: tmp
              mountPath: /tmp
          # Memory sized for the heap (75% of the limit) plus the JVM's own. No CPU limit, so a
          # burst is not throttled; the request is what the autoscaler and scheduler count.
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Up to two and a half minutes to start, migrations included, before liveness counts.
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            failureThreshold: 30
          # Alive: never depends on PostgreSQL or Redis, so an outage does not restart every pod.
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # Ready: DOWN while PostgreSQL or Redis does not answer, which takes the pod out of the
          # Service until they do.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
      volumes:
        - name: secrets
          secret:
            secretName: rideflow-secrets
            defaultMode: 0440
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rideflow-backend
  labels:
    app.kubernetes.io/name: rideflow-backend
spec:
  selector:
    app.kubernetes.io/name: rideflow-backend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rideflow-backend
  labels:
    app.kubernetes.io/name: rideflow-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rideflow-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rideflow-backend
  labels:
    app.kubernetes.io/name: rideflow-backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rideflow-backend
