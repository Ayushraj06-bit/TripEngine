name: Nightly

# The slow suites, against main every night or on demand: the end-to-end and chaos tests. The
# one-command demo runs on every push, in CI's image job, before an image is published.
on:
  schedule:
    - cron: "37 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suites:
    name: ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [e2e, chaos]

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Only the profile's own tests: the unit and integration suites run on every push.
      - name: Run -P${{ matrix.profile }}
        run: >
          ./mvnw -B -ntp -P${{ matrix.profile }} verify
          -Dtest=none -Dsurefire.failIfNoSpecifiedTests=false -Djacoco.skip=true

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.profile }}-reports
          path: "**/target/failsafe-reports/"
          if-no-files-found: ignore
          retention-days: 7
