name: CI

on:
  push:
    branches: ["main", "phase-*"]
    tags: ["phase-*"]
  pull_request:
    branches: ["main"]
  # By hand: everything above, plus a recording of the live map from the demo (docs/images).
  workflow_dispatch:

# A new push to the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build and test
    # ubuntu-latest ships a Docker daemon, which Testcontainers needs.
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Compiles both modules and their tests, and checks formatting and the build rules.
      - name: Build
        run: ./mvnw -B -ntp package -DskipTests -Djacoco.skip=true

      # Pure logic, no containers: the state machine, fares, surge, geo math, validators.
      - name: Unit tests
        run: ./mvnw -B -ntp test -Dgroups='!integration'

      # Real PostgreSQL, Redis and Kafka through Testcontainers.
      - name: Integration tests
        run: ./mvnw -B -ntp test -Dgroups=integration

      # Both runs recorded into the same JaCoCo data. Below 80% line coverage on trip, matching,
      # pricing, payment or shared, the build fails (PROJECT_SPEC section 12).
      - name: Coverage gate
        run: ./mvnw -B -ntp -pl backend jacoco:report jacoco:check@check

      # The alert rules' own unit tests, with the Prometheus version compose runs.
      - name: Test alert rules
        run: >
          docker run --rm -v "$PWD/infra/prometheus:/p" --entrypoint promtool
          prom/prometheus:v3.14.0 test rules /p/alerts.test.yml

      # Against the Kubernetes API schemas. The nightly workflow runs them on a kind cluster.
      - name: Check Kubernetes manifests
        run: >
          docker run --rm -v "$PWD/infra:/m" ghcr.io/yannh/kubeconform:v0.6.4
          -strict -summary -kubernetes-version 1.30.0 /m/k8s/backend.yaml /m/k8s-kind/stores.yaml

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"
          if-no-files-found: ignore
          retention-days: 7

  web:
    name: web app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # The committed types are exactly what the committed API snapshot generates.
      - name: API types match the snapshot
        run: npm run api:types && git diff --exit-code src/api/schema.d.ts

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Includes the check that every error code the backend can send has words in the app,
      # read from backend/src - so a new backend code fails here until it has copy.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  images:
    name: images
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      # Pushed from main and from phase tags; every other build only proves the images build and run.
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/phase-')) }}
      COMPOSE: docker compose -f infra/docker-compose.yml -f infra/docker-compose.scale.yml

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # The registry wants a lower-case name; the account's is not.
      - name: Image names
        run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Backend tags
        id: backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/rideflow-backend
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Simulator tags
        id: simulator
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/rideflow-simulator
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      # Also tagged with the names the one-command demo runs, so the step below starts these images.
      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          load: true
          tags: |
            ${{ steps.backend.outputs.tags }}
            rideflow-backend:local
          labels: ${{ steps.backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build simulator
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          build-args: |
            MODULE=simulator
            PORT=8081
          load: true
          tags: |
            ${{ steps.simulator.outputs.tags }}
            rideflow-simulator:local
          labels: ${{ steps.simulator.outputs.labels }}
          cache-from: type=gha,scope=simulator
          cache-to: type=gha,mode=max,scope=simulator

      - name: Image sizes
        run: |
          for module in backend simulator; do
            size=$(docker image inspect --format '{{.Size}}' "rideflow-$module:local")
            echo "rideflow-$module: $((size / 1024 / 1024)) MiB" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      # Nothing is published that has not run: the one-command demo, on the images just built.
      # demo-info runs last, once both backends, the simulator and the dashboards are healthy.
      - name: Start the one-command demo
        run: |
          $COMPOSE up -d --no-build
          timeout 900 sh -c 'until [ "$(docker inspect -f "{{.State.Status}}" rideflow-demo-info-1 2>/dev/null)" = exited ]; do sleep 5; done'
          docker logs rideflow-demo-info-1
          test "$(docker inspect -f '{{.State.ExitCode}}' rideflow-demo-info-1)" = 0

      - name: The URLs it printed answer
        run: |
          curl -fsS -o /dev/null http://localhost:8080/admin/live-map.html
          curl -fsS -o /dev/null http://localhost:8080/swagger-ui/index.html
          curl -fsS -o /dev/null http://localhost:3000/api/health
          curl -fsS -o /dev/null http://localhost:9090/-/ready

      # The simulator's riders book through the load balancer within a couple of minutes.
      # The web client's types are generated from a committed copy of this API (web/src/api).
      # A backend change that alters the API must update that copy in the same commit.
      - name: The API matches the web client's snapshot
        run: node web/scripts/openapi.mjs check

      - name: Trips are being booked
        run: |
          query='sum(trips_requested_total)'
          timeout 300 sh -c "until curl -fsS --get http://localhost:9090/api/v1/query --data-urlencode query='$query' | grep -q '\"value\":\[[^,]*,\"[1-9]'; do sleep 10; done"

      # Only on a manual run: the README's GIF, from the demo just checked.
      - uses: actions/setup-python@v5
        if: github.event_name == 'workflow_dispatch'
        with:
          python-version: "3.12"

      - name: Record the live map
        if: github.event_name == 'workflow_dispatch'
        run: |
          pip install -q playwright==1.55.0 pillow==11.3.0
          python -m playwright install --with-deps chromium
          # The admin login the demo generated, from its secrets volume.
          set -a
          eval "$(docker run --rm -v rideflow_secrets:/s:ro alpine:3.22 cat /s/demo.env)"
          set +a
          python .github/scripts/record_live_map.py live-map.gif

      - name: Upload the recording
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: live-map
          path: live-map.gif
          retention-days: 7

      - name: Demo logs
        if: failure()
        run: $COMPOSE logs --tail 200

      - name: Stop the demo
        if: always()
        run: $COMPOSE down -v

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: env.PUBLISH == 'true'
        run: |
          docker push --all-tags "$REGISTRY/rideflow-backend"
          docker push --all-tags "$REGISTRY/rideflow-simulator"
