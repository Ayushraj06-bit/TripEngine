# Spring's test context cache keeps every distinct test context for the whole run, and each one
# starts its own PostgreSQL, Redis and Kafka (TestcontainersConfiguration). Past this many, the
# least recently used context is closed and its containers stopped. About fourteen sets at once,
# some 500 MB each, overwhelmed a Docker VM of 7.75 GB - the size of a CI runner too.
spring.test.context.cache.maxSize=6
