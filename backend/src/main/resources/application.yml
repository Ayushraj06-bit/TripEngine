spring:
  application:
    name: rideflow-backend

  datasource:
    url: ${RIDEFLOW_DB_URL:jdbc:postgresql://localhost:5432/rideflow}
    username: ${RIDEFLOW_DB_USER:rideflow}
    password: ${RIDEFLOW_DB_PASSWORD:rideflow}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway is the single source of truth for the schema (PROJECT_SPEC section 7).
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Updates in primary-key order: two ledger postings touching the same accounts lock
        # them in the same order, so they wait for each other instead of deadlocking.
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${RIDEFLOW_REDIS_HOST:localhost}
      port: ${RIDEFLOW_REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${RIDEFLOW_KAFKA_BOOTSTRAP:localhost:9092}

  threads:
    virtual:
      enabled: true

  mvc:
    problemdetails:
      # Spring's own exceptions (unknown route, unsupported method, unreadable body)
      # become RFC 9457 problem details too, so no error escapes the shape section 10 wants.
      enabled: true

  # Opt in per profile: on for local, off everywhere else.
  docker-compose:
    enabled: false

  modulith:
    events:
      republish-outstanding-events-on-restart: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,modulith
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        # Liveness must not depend on anything external: a dead Redis is not a reason
        # for an orchestrator to restart an otherwise healthy process.
        liveness:
          include: livenessState
        # Readiness does depend on them, because without them it cannot serve traffic.
        readiness:
          include: readinessState,db,redis
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${RIDEFLOW_TRACE_SAMPLE:0.1}
  otlp:
    tracing:
      endpoint: ${RIDEFLOW_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  structured:
    format:
      # ECS JSON on the console, with trace and span ids attached by Micrometer.
      console: ${RIDEFLOW_LOG_FORMAT:ecs}

server:
  port: 8080
  shutdown: graceful

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Business constants - PROJECT_SPEC section 9.
# Bound and validated by RideFlowProperties. Never hard-code these values in code.
rideflow:
  location:
    min-interval-ms: 1000
    min-move-meters: 10
    force-write-seconds: 15
    stale-after-seconds: 30
    max-speed-kmph: 150
    max-accuracy-meters: 100
    # Phase 2 additions. Not in section 9, but section 11 forbids magic numbers.
    spoof-strikes-before-flag: 5
    stale-sweep-batch-size: 500
    stale-sweep-interval: PT5S
    nearby-result-limit: 15
    nearby-cache-seconds: 2
    # 3 decimal places is roughly 110 m. Used both to blur the public position and to
    # decide which riders share a cache entry, so the two can never drift apart.
    nearby-rounding-decimals: 3
    # Phase 6: live position to the rider during a trip, and the recorded route.
    driver-location-forward-ms: 2000
    route-max-points: 5000
    route-ttl-hours: 6
    session-expiry-check-interval: PT15S
  matching:
    radius-steps-km: [2, 4, 7]
    candidates-per-search: 20
    offer-timeout-seconds: 12
    deadline-seconds: 60
    research-interval-seconds: 5
    fairness-bucket-meters: 300
    min-driver-rating: 3.5
    # Phase 5 additions. Section 7 gives the lock "offer timeout + 3 s" and the
    # match and offer state 10 minutes; the intervals are the Phase 5 brief's.
    lock-grace-seconds: 3
    state-ttl-minutes: 10
    offer-poll-interval: PT0.5S
    offer-poll-batch-size: 100
    recovery-interval: PT15S
    recovery-grace-seconds: 10
    recovery-batch-size: 200
    offer-pickup-rounding-decimals: 3
  pricing:
    road-factor: 1.3
    quote-ttl-minutes: 5
    min-trip-meters: 300
    max-trip-km: 60
    reprice-deviation: 0.20
    # Phase 3 additions. City averages, to turn distance into duration.
    average-speed-kmph:
      bike: 25
      auto: 20
      car: 22
    quote-rate-limit-per-minute: 30
    rate-card-refresh-seconds: 60
  trip:
    arrival-geofence-meters: 150
    free-wait-minutes: 3
    no-show-after-minutes: 5
    otp-max-attempts: 3
    rider-cancel-grace-seconds: 120
    # Phase 4 additions. Section 6 fixes the OTP lock at 2 minutes; section 7 purges
    # idempotency keys after 24 hours.
    otp-lock-minutes: 2
    idempotency-retention-hours: 24
    idempotency-purge-interval: PT1H
    # Phase 6: trips flagged for review.
    driver-silence-flag-minutes: 10
    driver-silence-check-interval: PT1M
    short-trip-flag-seconds: 60
    short-trip-flag-meters: 100
    reprice-flag-increase: 0.5
    silence-check-batch-size: 500
  surge:
    geohash-precision: 6
    window-minutes: 5
    tick-seconds: 30
    max-step-per-tick: 0.25
    cap: 2.5
    ttl-seconds: 90
    # Phase 8. Ratio of demand to supply -> target multiplier; above the last step, the cap.
    steps:
      - max-ratio: 1.0
        multiplier: 1.0
      - max-ratio: 1.5
        multiplier: 1.2
      - max-ratio: 2.0
        multiplier: 1.5
      - max-ratio: 3.0
        multiplier: 2.0
    cache-seconds: 5
    demand-ttl-minutes: 10
    override-max-hours: 24
    # How often the job runs, and how long it holds the lock: most of a tick, so a second
    # instance whose schedule is a few seconds off cannot step the multiplier twice.
    tick-interval: PT${rideflow.surge.tick-seconds}S
    lock-at-least-for: PT20S
  payment:
    commission-percent: 20
    # Phase 7: wallet top-ups, ₹10 to ₹10,000.
    min-topup-paise: 1000
    max-topup-paise: 1000000
    # Signs and verifies gateway webhooks. Never committed: set RIDEFLOW_GATEWAY_WEBHOOK_SECRET.
    # Blank generates one per process, which only works while there is one instance.
    webhook-secret: ${RIDEFLOW_GATEWAY_WEBHOOK_SECRET:}
    webhook-tolerance-seconds: 300
    posting-max-attempts: 10
    reconcile-report-limit: 100
    # Nightly, after the evening peak and before the morning one.
    reconcile-cron: "0 30 3 * * *"
    mock-gateway:
      # Its payment page credits any wallet that asks, so it exists only where turned on
      # (RIDEFLOW_PAYMENT_MOCKGATEWAY_ENABLED=true): tests, a laptop, a demo. Never prod.
      enabled: false
      base-url: http://localhost:8080
      webhook-url: ""
      outcome: SUCCEEDED
      delay-ms: 0
      unavailable: false
  notification:
    sequence-ttl-hours: 24
  events:
    # A listener that failed is delivered again this long after its event, by a job that
    # runs every redelivery-interval - not only when the application restarts.
    redeliver-after-seconds: 120
    redelivery-interval: PT1M
  rating:
    window-days: 7

  # The city RideFlow operates in (PROJECT_SPEC section 1: one configured service
  # area). This box covers Bengaluru; replace it with the real boundary per
  # deployment. A point exactly on an edge counts as inside.
  service-area:
    vertices:
      - { lat: 13.1400, lng: 77.4600 }
      - { lat: 13.1400, lng: 77.7800 }
      - { lat: 12.8200, lng: 77.7800 }
      - { lat: 12.8200, lng: 77.4600 }

  # Authentication. PROJECT_SPEC section 9 does not cover auth, so this extends it
  # under the same prefix rather than hard-coding the values (section 11).
  security:
    # A URI, not a bare word: Spring's Jwt.getIssuer() parses this as a URL.
    issuer: ${RIDEFLOW_JWT_ISSUER:https://rideflow.local}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    max-login-attempts: 10
    login-lock-duration: 15m
    # Per client address. Raised only where one address is many people on purpose: the
    # simulator (application-local.yml and the E2E run).
    login-attempts-per-address-per-minute: 20
    registrations-per-address-per-hour: 3
    # Blank generates an ephemeral keypair and logs a warning. Both must be set
    # together before running more than one instance, or each will reject the
    # other's tokens.
    rsa-private-key: ${RIDEFLOW_RSA_PRIVATE_KEY:}
    rsa-public-key: ${RIDEFLOW_RSA_PUBLIC_KEY:}
    bootstrap-admin:
      # Deliberately no defaults: a committed admin password is a backdoor.
      phone: ${RIDEFLOW_ADMIN_PHONE:}
      password: ${RIDEFLOW_ADMIN_PASSWORD:}
      name: ${RIDEFLOW_ADMIN_NAME:RideFlow Admin}
