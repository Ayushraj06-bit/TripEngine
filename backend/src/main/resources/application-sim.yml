# Running against the traffic simulator (simulator/README.md): add it to whatever else is
# active, e.g. --spring.profiles.active=local,sim. Never in production: started alongside
# prod, the application refuses to run (SimProfileGuard). The simulator signs hundreds of users
# up and in from one address, so the per-address limits are off (RateLimitFilter).
rideflow:
  payment:
    mock-gateway:
      # Simulated riders top their wallets up through the mock gateway's payment page.
      enabled: true
