# Integration tests. Testcontainers supplies every connection detail through
# @ServiceConnection, so nothing here may point at a fixed host or port.
spring:
  docker-compose:
    enabled: false
  jpa:
    # Fail a test that quietly triggers a query outside an open session.
    open-in-view: false

rideflow:
  location:
    # Background jobs that mutate shared Redis state race any test that moves the
    # clock. Tests that need a sweep call it explicitly. It still runs once at
    # startup, so the scheduling wiring itself stays exercised.
    stale-sweep-interval: PT1H
    session-expiry-check-interval: PT1H
  surge:
    # Tests tick the surge job themselves, as often as they need.
    tick-interval: PT1H
    lock-at-least-for: PT0S
  payment:
    # Fixed, so a test can sign a webhook of its own.
    webhook-secret: test-webhook-secret
    # Tests reconcile when they mean to.
    reconcile-cron: "-"
  trip:
    driver-silence-check-interval: PT1H
    # Small, so a test with a few trips crosses a window boundary.
    silence-check-batch-size: 2
  matching:
    # Same reasoning: the offer poller and recovery sweep would race tests that move
    # the clock, so tests call them explicitly.
    offer-poll-interval: PT1H
    recovery-interval: PT1H

management:
  tracing:
    sampling:
      # No collector is running in tests; exporting would just log failures.
      probability: 0.0

logging:
  structured:
    format:
      console:
  level:
    com.rideflow: DEBUG
    org.testcontainers: INFO
    com.github.dockerjava: WARN
