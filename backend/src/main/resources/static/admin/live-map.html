<!doctype html>
<!--
  RideFlow live map (Phase 9, ADR 0015).

  The page itself is public and holds no data. An admin logs in here; the snapshot arrives over
  STOMP on /topic/admin/live-map, which only an ADMIN token may subscribe to. The token lives in
  this page's memory only - never in storage.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RideFlow live map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <style>
    html, body { margin: 0; height: 100%; font: 14px system-ui, sans-serif; color: #1b1b1b; }
    #map { position: absolute; inset: 0; }
    .panel { position: absolute; z-index: 1000; background: #fff; border-radius: 8px;
             box-shadow: 0 2px 10px rgba(0, 0, 0, .25); padding: 12px 14px; }
    #login { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 260px; }
    #login input, #login button { display: block; width: 100%; box-sizing: border-box;
                                  margin-top: 8px; padding: 8px; font: inherit; }
    #kpis { top: 12px; right: 12px; min-width: 220px; display: none; }
    #kpis dl { display: grid; grid-template-columns: auto auto; gap: 4px 16px; margin: 8px 0 0; }
    #kpis dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
    #legend { bottom: 24px; left: 12px; display: none; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
           margin-right: 6px; vertical-align: middle; }
    #status { font-size: 12px; color: #666; }
    .error { color: #b00020; }
  </style>
</head>
<body>
<div id="map"></div>

<form id="login" class="panel">
  <strong>RideFlow live map</strong>
  <input id="phone" placeholder="Admin phone" autocomplete="username" required>
  <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
  <button type="submit">Sign in</button>
  <div id="login-error" class="error"></div>
</form>

<div id="kpis" class="panel">
  <strong>Live</strong> <span id="status"></span>
  <dl>
    <dt>Online drivers</dt><dd id="k-online">-</dd>
    <dt>Active trips</dt><dd id="k-active">-</dd>
    <dt>Trips / minute</dt><dd id="k-tpm">-</dd>
    <dt>Avg time to assign</dt><dd id="k-assign">-</dd>
    <dt>No-driver rate</dt><dd id="k-nodriver">-</dd>
    <dt>Cancel rate</dt><dd id="k-cancel">-</dd>
  </dl>
  <div id="surge-off" class="error" style="display:none">Surge is switched off</div>
</div>

<div id="legend" class="panel">
  <div><span class="dot" style="background:#2e7d32"></span>Available</div>
  <div><span class="dot" style="background:#ef8f00"></span>Heading to pickup</div>
  <div><span class="dot" style="background:#1565c0"></span>On a trip</div>
  <div><span class="dot" style="background:#9e9e9e"></span>Offline</div>
  <div><span class="dot" style="background:#d32f2f;border-radius:0"></span>Surge (darker is higher)</div>
</div>

<script>
'use strict';

const COLOURS = { AVAILABLE: '#2e7d32', TO_PICKUP: '#ef8f00', TO_DROP: '#1565c0', OFFLINE: '#9e9e9e' };

const map = L.map('map', { preferCanvas: true }).setView([12.975, 77.62], 12);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);
// Drawn in this order, so drivers sit on top of their trip lines, and both on top of surge.
const surgeLayer = L.layerGroup().addTo(map);
const tripLayer = L.layerGroup().addTo(map);
const driverLayer = L.layerGroup().addTo(map);

let tokens = null;
let socket = null;

const $ = id => document.getElementById(id);

$('login').addEventListener('submit', async event => {
  event.preventDefault();
  $('login-error').textContent = '';
  const response = await fetch('/api/v1/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ phone: $('phone').value, password: $('password').value })
  });
  if (!response.ok) {
    $('login-error').textContent = 'Sign-in failed (' + response.status + ')';
    return;
  }
  tokens = await response.json();
  $('password').value = '';
  $('login').style.display = 'none';
  $('kpis').style.display = 'block';
  $('legend').style.display = 'block';
  connect();
});

/** Spring closes the socket when the access token expires: refresh it, then connect again. */
async function reconnect() {
  $('status').textContent = 'reconnecting...';
  const response = await fetch('/api/v1/auth/refresh', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ refreshToken: tokens.refreshToken })
  }).catch(() => null);
  if (response && response.ok) {
    tokens = await response.json();
  }
  setTimeout(connect, 2000);
}

/** STOMP 1.2 over a plain WebSocket: a few lines, so no client library. */
function connect() {
  const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
  socket = new WebSocket(scheme + '://' + location.host + '/ws', ['v12.stomp']);
  socket.binaryType = 'arraybuffer';
  socket.onopen = () => send('CONNECT', {
    'accept-version': '1.2',
    host: location.hostname,
    Authorization: 'Bearer ' + tokens.accessToken,
    'heart-beat': '0,0'
  });
  socket.onmessage = event => {
    // Text frames normally; a binary one is decoded rather than dropped.
    const data = typeof event.data === 'string' ? event.data : new TextDecoder().decode(event.data);
    const frame = parse(data);
    if (!frame) {
      return;
    }
    if (frame.command === 'CONNECTED') {
      $('status').textContent = 'connected';
      send('SUBSCRIBE', { id: 'live-map', destination: '/topic/admin/live-map' });
    } else if (frame.command === 'MESSAGE') {
      draw(JSON.parse(frame.body).payload);
    } else if (frame.command === 'ERROR') {
      // A token without the ADMIN role ends here: the subscription is refused.
      $('status').textContent = 'refused: ' + (frame.headers.message || 'error');
      socket.onclose = null;
    }
  };
  socket.onclose = reconnect;
}

function send(command, headers) {
  const lines = Object.entries(headers).map(([name, value]) => name + ':' + value);
  socket.send(command + '\n' + lines.join('\n') + '\n\n\0');
}

function parse(data) {
  const split = data.indexOf('\n\n');
  if (split < 0) {
    return null; // A heartbeat.
  }
  const [command, ...lines] = data.slice(0, split).split('\n');
  const headers = {};
  lines.forEach(line => {
    const colon = line.indexOf(':');
    headers[line.slice(0, colon)] = line.slice(colon + 1);
  });
  const body = data.slice(split + 2);
  return { command, headers, body: body.endsWith('\0') ? body.slice(0, -1) : body };
}

function draw(snapshot) {
  surgeLayer.clearLayers();
  snapshot.surgeCells.forEach(cell => {
    const heat = Math.min(1, (cell.multiplier - 1) / 1.5);
    if (heat <= 0) {
      return;
    }
    L.rectangle([[cell.minLat, cell.minLng], [cell.maxLat, cell.maxLng]], {
      stroke: false, fillColor: '#d32f2f', fillOpacity: 0.15 + 0.45 * heat
    }).addTo(surgeLayer);
  });

  tripLayer.clearLayers();
  driverLayer.clearLayers();
  let online = 0;
  snapshot.drivers.forEach(driver => {
    const state = driver.tripPhase || driver.status || 'OFFLINE';
    if (driver.status !== 'OFFLINE') {
      online++;
    }
    if (driver.targetLat != null) {
      L.polyline([[driver.lat, driver.lng], [driver.targetLat, driver.targetLng]], {
        color: COLOURS[state], weight: 2, opacity: 0.7, dashArray: state === 'TO_PICKUP' ? '4 4' : null
      }).addTo(tripLayer);
    }
    L.circleMarker([driver.lat, driver.lng], {
      radius: 4, weight: 1, color: '#fff', fillColor: COLOURS[state] || COLOURS.OFFLINE, fillOpacity: 1
    }).addTo(driverLayer);
  });

  const kpis = snapshot.kpis;
  $('k-online').textContent = online;
  $('k-active').textContent = kpis.activeTrips;
  $('k-tpm').textContent = kpis.tripsPerMinute.toFixed(1);
  $('k-assign').textContent = kpis.averageSecondsToAssign == null
    ? '-' : kpis.averageSecondsToAssign.toFixed(1) + ' s';
  $('k-nodriver').textContent = (100 * kpis.noDriverRate).toFixed(1) + ' %';
  $('k-cancel').textContent = (100 * kpis.cancelRate).toFixed(1) + ' %';
  $('surge-off').style.display = snapshot.surgeOff ? 'block' : 'none';
  $('status').textContent = new Date(snapshot.at).toLocaleTimeString();
}
</script>
</body>
</html>
