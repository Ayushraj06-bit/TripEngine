<!doctype html>
<!--
  RideFlow live map (Phase 9, ADR 0015).

  The page itself is public and holds no data. An admin logs in here; the snapshot arrives over
  STOMP on /topic/admin/live-map, which only an ADMIN token may subscribe to. The token lives in
  this page's memory only - never in storage.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RideFlow live map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <style>
    html, body { margin: 0; height: 100%; font: 14px system-ui, sans-serif; color: #1b1b1b; }
    #map { position: absolute; inset: 0; }
    .panel { position: absolute; z-index: 1000; background: #fff; border-radius: 8px;
             box-shadow: 0 2px 10px rgba(0, 0, 0, .25); padding: 12px 14px; }
    #login { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 260px; }
    #login input, #login button { display: block; width: 100%; box-sizing: border-box;
                                  margin-top: 8px; padding: 8px; font: inherit; }
    #kpis { top: 12px; right: 12px; min-width: 220px; display: none; }
    #kpis dl { display: grid; grid-template-columns: auto auto; gap: 4px 16px; margin: 8px 0 0; }
    #kpis dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
    #legend { bottom: 24px; left: 12px; display: none; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
           margin-right: 6px; vertical-align: middle; }
    #status { font-size: 12px; color: #666; }
    .error { color: #b00020; }
  </style>
</head>
<body>
<div id="map"></div>

<form id="login" class="panel">
  <strong>RideFlow live map</strong>
  <input id="phone" placeholder="Admin phone" autocomplete="username" required>
  <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
  <button type="submit">Sign in</button>
  <div id="login-error" class="error"></div>
</form>

<div id="kpis" class="panel">
  <strong>Live</strong> <span id="status"></span>
  <dl>
    <dt>Online drivers</dt><dd id="k-online">-</dd>
    <dt>Active trips</dt><dd id="k-active">-</dd>
    <dt>Trips / minute</dt><dd id="k-tpm">-</dd>
    <dt>Avg time to assign</dt><dd id="k-assign">-</dd>
    <dt>No-driver rate</dt><dd id="k-nodriver">-</dd>
    <dt>Cancel rate</dt><dd id="k-cancel">-</dd>
  </dl>
  <div id="surge-off" class="error" style="display:none">Surge is switched off</div>
</div>

<div id="legend" class="panel">
  <div><span class="dot" style="background:#2e7d32"></span>Available</div>
  <div><span class="dot" style="background:#ef8f00"></span>Heading to pickup</div>
  <div><span class="dot" style="background:#1565c0"></span>On a trip</div>
  <div><span class="dot" style="background:#9e9e9e"></span>Offline</div>
  <div><span class="dot" style="background:#d32f2f;border-radius:0"></span>Surge (darker is higher)</div>
</div>

<script src="live-map.js"></script>
</body>
</html>
